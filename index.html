<!DOCTYPE html>
<html lang="zh-TW">
    <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>THEKUMEE 訂單系統</title>
        <style>
                    * { margin: 0; padding: 0; box-sizing: border-box; }
                    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }
                    nav { background: white; border-bottom: 1px solid #ddd; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
                    .container { max-width: 1200px; margin: 0 auto; padding: 1rem; }
                    .section { background: white; border-radius: 8px; padding: 1.5rem; margin: 1rem 0; }
                    .section-title { font-size: 1.25rem; font-weight: bold; margin-bottom: 1rem; color: #333; }
                    .form-group { margin-bottom: 1rem; }
                    input, textarea, button { padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; width: 100%; }
                    button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
                    button:hover { background: #0056b3; }
                    .btn-success { background: #28a745; }
                    .btn-danger { background: #dc3545; }
                    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
                    .card { border: 1px solid #ddd; padding: 1rem; border-radius: 4px; background: white; }
                    .product-item { border-left: 4px solid #007bff; padding-left: 1rem; margin: 0.5rem 0; }
                    .cart-item { background: #f9f9f9; padding: 1rem; margin: 0.5rem 0; border-radius: 4px; }
                    .bank-info { background: #e3f2fd; border: 1px solid #2196f3; padding: 1rem; border-radius: 4px; }
                    .error { color: #dc3545; }
                    .success { color: #28a745; }
                    .loading { text-align: center; padding: 2rem; color: #666; }
                </style>
    </head>
    <body>
            <nav>
                        <h1>🛍️ THEKUMEE</h1>
                    <div id="cartCount" style="background: #dc3545; color: white; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-weight: bold;">0</div>div>
            </nav>
    
        <div class="container">
                <!-- 관리자 섹션 -->
                <div class="section" style="background: #fff3cd; border: 2px solid #ffc107;">
                            <div class="section-title">📦 상품 관리 (관리자)</div>div>
                            <div class="form-group">
                                            <input type="text" id="adminProductName" placeholder="상품명" />
                            </div>div>
                            <div class="form-group">
                                            <input type="number" id="adminProductPrice" placeholder="가격" />
                            </div>div>
                            <div class="form-group">
                                            <input type="number" id="adminProductQty" placeholder="수량" />
                            </div>div>
                            <button class="btn-success" onclick="addProduct()">상품 추가</button>button>
                            <div id="adminProductsList" style="margin-top: 1rem; max-height: 200px; overflow-y: auto;"></div>div>
                </div>div>
        
                <!-- 상품 목록 -->
                <div class="section">
                            <div class="section-title">🛒 상품 목록</div>div>
                            <div class="grid" id="productsList">
                                            <div class="loading">상품을 로딩 중입니다...</div>div>
                            </div>div>
                </div>div>
        
                <!-- 장바구니 -->
                <div class="section">
                            <div class="section-title">🛍️ 장바구니</div>div>
                            <div id="cartItems"></div>div>
                            <div style="background: #e3f2fd; padding: 1rem; border-radius: 4px; margin-top: 1rem;">
                                            <strong>총액: NT$<span id="cartTotal">0.00</span>span></strong>
                            </div>div>
                </div>div>
        
                <!-- 주문 정보 -->
                <div class="section">
                            <div class="section-title">📋 주문정보</div>div>
                            <div class="form-group">
                                            <input type="text" id="customerName" placeholder="이름" />
                            </div>div>
                            <div class="form-group">
                                            <input type="tel" id="customerPhone" placeholder="전화" />
                            </div>div>
                            <div class="form-group">
                                            <input type="email" id="customerEmail" placeholder="이메일" />
                            </div>div>
                            <div class="form-group">
                                            <textarea id="customerAddress" placeholder="주소" rows="3"></textarea>
                            </div>div>
                            <button style="background: #007bff;" onclick="placeOrder()">주문하기</button>button>
                </div>div>
        
                <!-- 은행 정보 -->
                <div class="bank-info">
                            <div class="section-title" style="color: #1976d2;">🏦 台灣銀行</div>div>
                            <p><strong>銀行:</strong>strong> <span id="bankName">-</span>span></p>
                            <p><strong>帳號:</strong> <span id="bankAccount">-</span>span></p>
                            <p><strong>戶名:</strong> <span id="accountName">-</span>span></p>
                </div>div>
        </div>div>
    
        <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>
    
        <script>
                    const firebaseConfig = {
                                    apiKey: "AIzaSyBLDa6TGPaVGvJf8bVj-_bGFYqt6qxF85A",
                                    authDomain: "thekumee-9c172.firebaseapp.com",
                                    databaseURL: "https://thekumee-9c172-default-rtdb.firebaseio.com",
                                    projectId: "thekumee-9c172",
                                    storageBucket: "thekumee-9c172.appspot.com",
                                    messagingSenderId: "162040568294",
                                    appId: "1:162040568294:web:e9c3c5b3d8f4a2b1c6d7e8f9"
                    };

                    firebase.initializeApp(firebaseConfig);
                    const db = firebase.database();

                    let state = {
                                    products: {},
                                    cart: {},
                                    customerInfo: { name: '', phone: '', email: '', address: '' }
                    };

                    // 초기화
                    function init() {
                                    loadProducts();
                                    loadSettings();
                                    setupListeners();
                    }

                    // 실시간 리스너
                    function setupListeners() {
                                    db.ref('products').on('value', (snapshot) => {
                                                        state.products = snapshot.val() || {};
                                                        renderProducts();
                                                        renderAdminProducts();
                                    });

                                    db.ref('settings').on('value', (snapshot) => {
                                                        const data = snapshot.val() || {};
                                                        document.getElementById('bankName').textContent = data.bankName || '-';
                                                        document.getElementById('bankAccount').textContent = data.bankAccount || '-';
                                                        document.getElementById('accountName').textContent = data.accountName || '-';
                                    });
                    }

                    // 상품 로드
                    function loadProducts() {
                                    db.ref('products').once('value', (snapshot) => {
                                                        state.products = snapshot.val() || {};
                                                        renderProducts();
                                                        renderAdminProducts();
                                    });
                    }

                    // 설정 로드
                    function loadSettings() {
                                    db.ref('settings').once('value', (snapshot) => {
                                                        const data = snapshot.val() || {};
                                                        document.getElementById('bankName').textContent = data.bankName || '-';
                                                        document.getElementById('bankAccount').textContent = data.bankAccount || '-';
                                                        document.getElementById('accountName').textContent = data.accountName || '-';
                                    });
                    }

                    // 상품 추가
                    function addProduct() {
                                    const name = document.getElementById('adminProductName').value.trim();
                                    const price = parseFloat(document.getElementById('adminProductPrice').value) || 0;
                                    const qty = parseInt(document.getElementById('adminProductQty').value) || 0;

                                    if (!name || price <= 0 || qty <= 0) {
                                                        alert('모든 항목을 입력하세요');
                                                        return;
                                    }

                                    const productId = Date.now().toString();
                                    db.ref(`products/${productId}`).set({
                                                        name,
                                                        price,
                                                        quantity: qty,
                                                        id: productId,
                                                        createdAt: new Date().toISOString()
                                    }).then(() => {
                                                        document.getElementById('adminProductName').value = '';
                                                        document.getElementById('adminProductPrice').value = '';
                                                        document.getElementById('adminProductQty').value = '';
                                    }).catch(error => alert('오류: ' + error.message));
                    }

                    // 상품 렌더링
                    function renderProducts() {
                                    const container = document.getElementById('productsList');
                                    if (!state.products || Object.keys(state.products).length === 0) {
                                                        container.innerHTML = '<div style="grid-column: 1/-1; text-align: center;">상품이 없습니다</div>';
                                                        return;
                                    }

                                    container.innerHTML = Object.values(state.products).map(p => `
                                                    <div class="card">
                                                                        <div style="font-weight: bold; margin-bottom: 0.5rem;">${p.name}</div>
                                                                                            <div style="color: #28a745; font-weight: bold; margin-bottom: 0.5rem;">NT$${parseFloat(p.price).toFixed(2)}</div>
                                                                                                                <div style="font-size: 0.9rem; margin-bottom: 0.5rem;">재고: ${p.quantity}개</div>
                                                                                                                                    <input type="number" id="qty-${p.id}" min="1" max="${p.quantity}" value="1" style="width: 100%; padding: 0.5rem; margin-bottom: 0.5rem;" />
                                                                                                                                                        <button class="btn-success" style="margin: 0;" onclick="addToCart('${p.id}', '${p.name}', ${p.price})">장바구니</button>
                                                                                                                                                                        </div>
                                                                                                                                                                                    `).join('');
                    }

                    // 관리자 상품 렌더링
                    function renderAdminProducts() {
                                    const container = document.getElementById('adminProductsList');
                                    if (!state.products || Object.keys(state.products).length === 0) {
                                                        container.innerHTML = '<div style="text-align: center; color: #666;">등록된 상품 없음</div>';
                                                        return;
                                    }

                                    container.innerHTML = Object.values(state.products).map(p => `
                                                    <div class="product-item">
                                                                        <strong>${p.name}</strong> - NT$${p.price} (${p.quantity}개)
                                                                                            <button class="btn-danger" style="width: auto; margin-left: 1rem;" onclick="deleteProduct('${p.id}')">삭제</button>
                                                                                                            </div>
                                                                                                                        `).join('');
                    }

                    // 상품 삭제
                    function deleteProduct(id) {
                                    if (!confirm('삭제하시겠습니까?')) return;
                                    db.ref(`products/${id}`).remove().catch(e => alert('오류: ' + e.message));
                    }

                    // 장바구니 추가
                    function addToCart(id, name, price) {
                                    const qty = parseInt(document.getElementById(`qty-${id}`).value) || 1;
                                    if (qty < 1) { alert('수량을 입력하세요'); return; }

                                    if (!state.cart[id]) state.cart[id] = { name, price, cartQuantity: 0 };
                                    state.cart[id].cartQuantity += qty;
                                    renderCart();
                    }

                    // 수량 변경
                    function updateQty(id, qty) {
                                    const q = parseInt(qty) || 0;
                                    if (q <= 0) removeFromCart(id);
                                    else { state.cart[id].cartQuantity = q; renderCart(); }
                    }

                    // 장바구니 제거
                    function removeFromCart(id) {
                                    delete state.cart[id];
                                    renderCart();
                    }

                    // 장바구니 렌더링
                    function renderCart() {
                                    const items = document.getElementById('cartItems');
                                    const total = document.getElementById('cartTotal');

                                    if (!state.cart || Object.keys(state.cart).length === 0) {
                                                        items.innerHTML = '<div style="text-align: center; padding: 1rem; color: #666;">장바구니가 비어있습니다</div>';
                                                        total.textContent = '0.00';
                                                        document.getElementById('cartCount').textContent = '0';
                                                        return;
                                    }

                                    let totalAmount = 0, itemCount = 0;
                                    items.innerHTML = Object.entries(state.cart).map(([id, item]) => {
                                                        const itemTotal = item.price * item.cartQuantity;
                                                        totalAmount += itemTotal;
                                                        itemCount += item.cartQuantity;
                                                        return `
                                                                            <div class="cart-item">
                                                                                                    <div style="display: flex; justify-content: space-between; align-items: center;">
                                                                                                                                <strong>${item.name}</strong>
                                                                                                                                                            <button class="btn-danger" style="width: auto;" onclick="removeFromCart('${id}')">삭제</button>
                                                                                                                                                                                    </div>
                                                                                                                                                                                                            <div style="color: #28a745; font-weight: bold;">NT$${parseFloat(item.price).toFixed(2)}</div>
                                                                                                                                                                                                                                    <input type="number" min="1" value="${item.cartQuantity}" onchange="updateQty('${id}', this.value)" style="width: 100%; padding: 0.5rem;" />
                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                        `;
                                    }).join('');

                                    total.textContent = totalAmount.toFixed(2);
                                    document.getElementById('cartCount').textContent = itemCount;
                    }

                    // 주문
                    function placeOrder() {
                                    if (Object.keys(state.cart).length === 0) { alert('장바구니에 상품을 추가하세요'); return; }

                                    const name = document.getElementById('customerName').value.trim();
                                    const phone = document.getElementById('customerPhone').value.trim();

                                    if (!name || !phone) { alert('이름과 전화번호를 입력하세요'); return; }

                                    const orderId = Date.now().toString();
                                    const order = {
                                                        id: orderId,
                                                        customerInfo: {
                                                                                name,
                                                                                phone,
                                                                                email: document.getElementById('customerEmail').value.trim(),
                                                                                address: document.getElementById('customerAddress').value.trim()
                                                        },
                                                        items: state.cart,
                                                        total: Object.values(state.cart).reduce((sum, item) => sum + (item.price * item.cartQuantity), 0),
                                                        status: 'pending',
                                                        createdAt: new Date().toISOString()
                                    };

                                    db.ref(`orders/${orderId}`).set(order).then(() => {
                                                        alert('주문이 완료되었습니다!\n주문번호: ' + orderId);
                                                        state.cart = {};
                                                        renderCart();
                                                        document.getElementById('customerName').value = '';
                                                        document.getElementById('customerPhone').value = '';
                                                        document.getElementById('customerEmail').value = '';
                                                        document.getElementById('customerAddress').value = '';
                                    }).catch(e => alert('오류: ' + e.message));
                    }

                    // 시작
                    init();
        </script>
    </body>
</html>html>
        </script></strong></strong></p></p></strong></h1>
            </nav>
    </body>
        </style></title>
    </head>
